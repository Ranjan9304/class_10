<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class 10 - BSEB Online Test Portal</title>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f7f6; margin: 0; padding: 20px; user-select: none; }
        .container { max-width: 800px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); position: relative; z-index: 10; }
        h1, h2 { text-align: center; color: #333; }
        .form-group { margin-bottom: 15px; }
        select, input, button { width: 100%; padding: 12px; margin-top: 5px; border: 1px solid #ccc; border-radius: 5px; font-size: 16px; }
        button { background: #007bff; color: white; border: none; cursor: pointer; font-weight: bold; }
        button:hover { background: #0056b3; }
        .question-card { background: #fafafa; padding: 15px; border-left: 4px solid #007bff; margin-bottom: 15px; border-radius: 4px; }
        .option-label { display: block; background: #fff; padding: 10px; margin: 5px 0; border: 1px solid #ddd; border-radius: 4px; cursor: pointer; }
        .option-label:hover { background: #f0f8ff; }
        .correct { background-color: #d4edda !important; border-color: #c3e6cb !important; }
        .wrong { background-color: #f8d7da !important; border-color: #f5c6cb !important; }
        #timer { font-size: 20px; font-weight: bold; color: #dc3545; text-align: right; margin-bottom: 15px; }
        
        /* Rank Display Style */
        #rankDisplay { color: #0056b3; text-align: center; background: #e9f2ff; padding: 10px; border-radius: 5px; border: 1px solid #b8daff; }

        /* Dynamic Watermark */
        #watermark {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            pointer-events: none; z-index: 1; opacity: 0.04; 
            font-size: 30px; font-weight: bold; color: #000;
            display: flex; flex-wrap: wrap; overflow: hidden; align-content: flex-start;
        }
        .wm-text { padding: 20px; transform: rotate(-30deg); white-space: nowrap; }
    </style>
</head>
<body>

<div id="watermark"></div>

<div class="container" id="loginScreen">
    <h1>Class 10 - Online Test Portal</h1>
    
    <div class="form-group">
        <label>अपना विषय (Subject) चुनें:</label>
        <select id="subjectSelect" onchange="loadQuizzes()">
            <option value="">-- विषय चुनें --</option>
            <option value="Science">Science (विज्ञान)</option>
            <option value="SST">SST (सामाजिक विज्ञान)</option>
            <option value="Math">Math (गणित)</option>
            <option value="Hindi">Hindi (हिंदी)</option>
            <option value="Sanskrit">Sanskrit (संस्कृत)</option>
            <option value="English">English (अंग्रेजी)</option>
        </select>
    </div>

    <div class="form-group">
        <label>टेस्ट (Quiz) चुनें:</label>
        <select id="quizSelect"><option value="">-- पहले विषय चुनें --</option></select>
    </div>

    <div class="form-group">
        <label>अपना पूरा नाम दर्ज करें:</label>
        <input type="text" id="studentName" placeholder="उदा: Rahul Kumar" autocomplete="off">
    </div>

    <button onclick="startTest()">टेस्ट शुरू करें (Start Test)</button>
    <button onclick="checkReview()" style="background:#28a745; margin-top:10px;">पिछला रिजल्ट/रिव्यू देखें</button>
</div>

<div class="container" id="quizScreen" style="display:none;">
    <div id="timer">Time Left: <span id="timeDisplay">00:00</span></div>
    <h2 id="quizTitleDisplay"></h2>
    <div id="questionsContainer"></div>
    <button onclick="submitTest()" style="background:#28a745;">टेस्ट सबमिट करें (Submit)</button>
</div>

<div class="container" id="resultScreen" style="display:none;">
    <h1>टेस्ट समाप्त!</h1>
    <h2 id="scoreDisplay"></h2>
    <h3 id="rankDisplay">रैंक लोड हो रही है... कृपया प्रतीक्षा करें...</h3>
    <p style="color:red; text-align:center;">आप अपने सही/गलत उत्तर सबमिट करने के 1 घंटे के भीतर ही देख सकते हैं।</p>
    <div id="reviewContainer"></div>
    <button onclick="location.reload()" style="margin-top: 20px;">होम पेज पर जाएँ</button>
</div>

<script>
    // 1. FIREBASE CONFIGURATION (यहाँ अपनी Firebase Config डालें)
    const firebaseConfig = {
        apiKey: "YOUR_API_KEY",
        authDomain: "YOUR_AUTH_DOMAIN",
        databaseURL: "YOUR_DATABASE_URL",
        projectId: "YOUR_PROJECT_ID",
        storageBucket: "YOUR_STORAGE_BUCKET",
        messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
        appId: "YOUR_APP_ID"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // 2. ANTI-CHEATING SYSTEM
    document.addEventListener('contextmenu', event => event.preventDefault());
    document.addEventListener('keydown', function(e) {
        if (e.ctrlKey && (e.key === 'c' || e.key === 'v' || e.key === 'x' || e.key === 'u' || e.key === 'p')) {
            e.preventDefault();
        }
    });

    let isTestActive = false;
    document.addEventListener('visibilitychange', function() {
        if (document.hidden && isTestActive) {
            alert("चेतावनी: आपने टैब/विंडो बदली। आपका टेस्ट ऑटो-सबमिट किया जा रहा है!");
            submitTest();
        }
    });

    // 3. GLOBAL VARIABLES
    let currentQuizData = null;
    let quizId = null;
    let subject = null;
    let studentName = null;
    let timerInterval;

    // 4. LOAD QUIZZES BASED ON SUBJECT (CLASS 10)
    function loadQuizzes() {
        subject = document.getElementById('subjectSelect').value;
        const quizSelect = document.getElementById('quizSelect');
        quizSelect.innerHTML = '<option value="">Loading...</option>';

        if(subject) {
            db.ref(`Quizzes_Class10/${subject}`).once('value', snapshot => {
                quizSelect.innerHTML = '<option value="">-- टेस्ट चुनें --</option>';
                snapshot.forEach(child => {
                    let option = document.createElement('option');
                    option.value = child.key;
                    option.textContent = child.val().title || child.key;
                    quizSelect.appendChild(option);
                });
            });
        }
    }

    // 5. START TEST
    function startTest() {
        subject = document.getElementById('subjectSelect').value;
        quizId = document.getElementById('quizSelect').value;
        studentName = document.getElementById('studentName').value.trim();

        if(!subject || !quizId || !studentName) {
            alert("कृपया सभी जानकारी भरें!"); return;
        }

        // 5-Hour Retake Restriction Check
        const lastAttempt = localStorage.getItem(`attempt_10_${subject}_${quizId}_${studentName}`);
        if (lastAttempt && (Date.now() - parseInt(lastAttempt)) < 5 * 60 * 60 * 1000) {
            alert("आप 5 घंटे की अवधि पूरी होने से पहले यह टेस्ट दोबारा नहीं दे सकते।");
            return;
        }

        db.ref(`Quizzes_Class10/${subject}/${quizId}`).once('value', snapshot => {
            currentQuizData = snapshot.val();
            if(currentQuizData && currentQuizData.questions) {
                generateWatermark(studentName);
                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('quizScreen').style.display = 'block';
                document.getElementById('quizTitleDisplay').innerText = currentQuizData.title || quizId;
                
                isTestActive = true;
                renderQuestions(currentQuizData.questions);
                startTimer(currentQuizData.timer || 30);
            }
        });
    }

    // 6. RENDER QUESTIONS (NO RANDOMIZATION)
    function renderQuestions(questions) {
        const container = document.getElementById('questionsContainer');
        container.innerHTML = '';
        
        questions.forEach((q, index) => {
            let qDiv = document.createElement('div');
            qDiv.className = 'question-card';
            let html = `<h3>प्र. ${index + 1}: ${q.question}</h3>`;
            
            // Render options strictly in original JSON order
            q.options.forEach((opt, i) => {
                html += `<label class="option-label">
                            <input type="radio" name="q${index}" value="${opt}"> ${opt}
                         </label>`;
            });
            qDiv.innerHTML = html;
            container.appendChild(qDiv);
        });
    }

    // 7. TIMER LOGIC
    function startTimer(minutes) {
        let timeInSeconds = minutes * 60;
        const display = document.getElementById('timeDisplay');
        timerInterval = setInterval(() => {
            let m = Math.floor(timeInSeconds / 60);
            let s = timeInSeconds % 60;
            display.innerText = `${m < 10 ? '0'+m : m}:${s < 10 ? '0'+s : s}`;
            if (timeInSeconds <= 0) {
                clearInterval(timerInterval);
                alert("समय समाप्त! टेस्ट ऑटो-सबमिट हो रहा है।");
                submitTest();
            }
            timeInSeconds--;
        }, 1000);
    }

    // 8. DYNAMIC WATERMARK
    function generateWatermark(name) {
        const wm = document.getElementById('watermark');
        wm.innerHTML = '';
        for(let i=0; i<100; i++) {
            let span = document.createElement('span');
            span.className = 'wm-text';
            span.innerText = name;
            wm.appendChild(span);
        }
    }

    // 9. SUBMIT TEST & FETCH RANK
    function submitTest() {
        isTestActive = false;
        clearInterval(timerInterval);
        
        let score = 0;
        let userAnswers = {};
        
        currentQuizData.questions.forEach((q, index) => {
            const selected = document.querySelector(`input[name="q${index}"]:checked`);
            if(selected) {
                userAnswers[index] = selected.value;
                if(selected.value === q.answer) { score++; }
            } else {
                userAnswers[index] = null;
            }
        });

        const timestamp = Date.now();
        
        // Push Data to Firebase
        const newRecordRef = db.ref(`Leaderboard_Class10/${subject}/${quizId}`).push();
        newRecordRef.set({
            name: studentName,
            score: score,
            total: currentQuizData.questions.length,
            timestamp: timestamp,
            answers: userAnswers
        }).then(() => {
            // After saving, calculate and display Rank
            calculateAndDisplayRank(newRecordRef.key);
        });

        // Set Local Storage
        localStorage.setItem(`attempt_10_${subject}_${quizId}_${studentName}`, timestamp);
        localStorage.setItem(`recordKey_10_${subject}_${quizId}_${studentName}`, newRecordRef.key); // Store key for review
        localStorage.setItem(`review_10_${subject}_${quizId}_${studentName}`, JSON.stringify(userAnswers));

        // UI Changes
        document.getElementById('quizScreen').style.display = 'none';
        document.getElementById('resultScreen').style.display = 'block';
        document.getElementById('scoreDisplay').innerText = `आपका स्कोर: ${score} / ${currentQuizData.questions.length}`;
        document.getElementById('rankDisplay').innerText = "रैंक कैलकुलेट की जा रही है...";
        
        renderReview(userAnswers);
    }

    // 10. CALCULATE AND DISPLAY RANK
    function calculateAndDisplayRank(recordKey) {
        db.ref(`Leaderboard_Class10/${subject}/${quizId}`).once('value', snapshot => {
            let results = [];
            snapshot.forEach(child => {
                results.push({ key: child.key, ...child.val() });
            });

            // Sort logic: Highest score first, if tie -> Earliest timestamp first
            results.sort((a, b) => b.score - a.score || a.timestamp - b.timestamp);

            // Find current student's rank
            let rankIndex = results.findIndex(r => r.key === recordKey);
            
            if (rankIndex !== -1) {
                let rank = rankIndex + 1;
                document.getElementById('rankDisplay').innerText = `🏆 आपकी रैंक: #${rank} (कुल ${results.length} छात्रों में)`;
            } else {
                document.getElementById('rankDisplay').innerText = "रैंक प्राप्त करने में त्रुटि हुई।";
            }
        });
    }

    // 11. 1-HOUR REVIEW WINDOW CHECK & RENDER
    function checkReview() {
        subject = document.getElementById('subjectSelect').value;
        quizId = document.getElementById('quizSelect').value;
        studentName = document.getElementById('studentName').value.trim();

        if(!subject || !quizId || !studentName) {
            alert("रिव्यू देखने के लिए विषय, टेस्ट और अपना नाम दर्ज करें!"); return;
        }

        const submitTime = localStorage.getItem(`attempt_10_${subject}_${quizId}_${studentName}`);
        const recordKey = localStorage.getItem(`recordKey_10_${subject}_${quizId}_${studentName}`);
        
        if (!submitTime || !recordKey) {
            alert("आपने अभी तक यह टेस्ट नहीं दिया है या डेटा मौजूद नहीं है।"); return;
        }

        // 1-Hour Restriction Logic
        if (Date.now() - parseInt(submitTime) > 60 * 60 * 1000) {
            alert("रिव्यू का समय समाप्त हो गया है। आप टेस्ट सबमिट करने के 1 घंटे के भीतर ही आंसर की (Answer Key) देख सकते हैं।");
            return;
        }

        db.ref(`Quizzes_Class10/${subject}/${quizId}`).once('value', snapshot => {
            currentQuizData = snapshot.val();
            let savedAnswers = JSON.parse(localStorage.getItem(`review_10_${subject}_${quizId}_${studentName}`));
            
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('resultScreen').style.display = 'block';
            document.getElementById('scoreDisplay').innerText = "आपका रिव्यू पैनल (Answer Key)";
            
            // Fetch and display rank again during review
            document.getElementById('rankDisplay').innerText = "रैंक लोड हो रही है...";
            calculateAndDisplayRank(recordKey);

            renderReview(savedAnswers);
        });
    }

    function renderReview(userAnswers) {
        const container = document.getElementById('reviewContainer');
        container.innerHTML = '';

        currentQuizData.questions.forEach((q, index) => {
            let qDiv = document.createElement('div');
            qDiv.className = 'question-card';
            let html = `<h3>प्र. ${index + 1}: ${q.question}</h3>`;
            
            q.options.forEach(opt => {
                let cssClass = '';
                if(opt === q.answer) {
                    cssClass = 'correct'; // Highlight correct answer green
                } else if(userAnswers[index] === opt && opt !== q.answer) {
                    cssClass = 'wrong'; // Highlight wrong selected answer red
                }
                
                let isChecked = (userAnswers[index] === opt) ? 'checked' : '';
                html += `<label class="option-label ${cssClass}">
                            <input type="radio" disabled ${isChecked}> ${opt}
                         </label>`;
            });
            qDiv.innerHTML = html;
            container.appendChild(qDiv);
        });
    }
</script>
</body>
</html>
